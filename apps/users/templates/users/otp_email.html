<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trendit OTP Verification</title>
    <style>
        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7fa;
            margin: 0;
            padding: 0;
            color: #333333;
        }
        .email-container {
            max-width: 600px;
            margin: 40px auto;
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }
        .header {
            background: linear-gradient(135deg, #161e2c 0%, #2a374a 100%);
            padding: 40px 20px;
            text-align: center;
        }
        .header h1 {
            color: #ffffff;
            margin: 0;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .content {
            padding: 40px 30px;
            text-align: center;
        }
        .content h2 {
            color: #161e2c;
            font-size: 22px;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .content p {
            font-size: 16px;
            line-height: 1.6;
            color: #555555;
            margin-bottom: 30px;
        }
        .otp-box {
            background-color: #f8fafc;
            border: 2px dashed #94a3b8;
            border-radius: 8px;
            padding: 20px;
            margin: 0 auto 30px auto;
            max-width: 300px;
        }
        .otp-code {
            font-size: 36px;
            font-weight: 700;
            color: #3b82f6;
            letter-spacing: 8px;
            margin: 0;
        }
        .warning {
            font-size: 14px;
            color: #888888;
            margin-bottom: 0;
        }
        .footer {
            background-color: #f8fafc;
            padding: 20px;
            text-align: center;
            border-top: 1px solid #e2e8f0;
        }
        .footer p {
            font-size: 14px;
            color: #64748b;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="email-container">
        <div class="header">
            <h1>TRENDIT</h1>
        </div>
        <div class="content">
            <h2>{{ title }}</h2>
            <p>Hello {{ username }},</p>
            <p>{{ message }}</p>
            
            <div class="otp-box">
                <p class="otp-code">{{ otp_code }}</p>
            </div>
            
            <p class="warning">This code will expire in 10 minutes. If you didn't request this, please ignore this email.</p>
        </div>
        <div class="footer">
            <p>&copy; {% now "Y" %} Trendit. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
